name: Deploy sites to GitHub Pages

on:
  push:
    branches:
      - claude/bilou-portfolio-site
      - claude/securify-hero-section-gn115k
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Bilou Portfolio
        working-directory: bilou-portfolio
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Build Marquilly Studio
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/marquilly-studio/

      - name: Combine builds
        run: |
          mkdir -p combined
          cp -r bilou-portfolio/dist/. combined/
          mkdir -p combined/marquilly-studio
          cp -r dist/. combined/marquilly-studio/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
